theme = "blowfish"
baseURL = "https://aswinnr.com/blogs/"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 30
enableEmoji = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[outputFormats.PostIndex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

# Separate feed for the Bookshelf section. Deliberately its own output format
# (not a reuse of PostIndex) so the shelf JSON shape can change without
# touching the blog feed — and vice versa.
[outputFormats.ShelfIndex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

# `section = ["HTML"]` is the default for every section. Sections that also
# need a JSON feed opt in via `outputs:` in their own _index.md
# (posts -> postindex, bookshelf -> shelfindex).
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
